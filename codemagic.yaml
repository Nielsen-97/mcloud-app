workflows:
  react-native-ios:
    name: MCloud iOS (unsigned device build for Sideloadly/AltStore)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Install CocoaPods
        script: |
          cd ios
          bundle install
          bundle exec pod install --repo-update
      - name: Build unsigned .app for a real device
        script: |
          xcodebuild \
            -workspace ios/MCloudApp.xcworkspace \
            -scheme MCloudApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package as .ipa
        script: |
          set -e
          APP_PATH="build/Build/Products/Debug-iphoneos/MCloudApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 2 >&2
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../MCloudApp.ipa Payload
    artifacts:
      - build/MCloudApp.ipa
