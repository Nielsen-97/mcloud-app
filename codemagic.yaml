workflows:
  react-native-ios:
    name: MCloud iOS
    max_build_duration: 60
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS
        script: |
          xcodebuild \
            -workspace ios/MCloudApp.xcworkspace \
            -scheme MCloudApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build
    artifacts:
      - build/Build/Products/**/*.app