workflows:
  react-native-ios:
    name: MCloud iOS (unsigned device build for Sideloadly/AltStore)
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22.11.0
      xcode: latest
      cocoapods: default
      groups:
        - default
    scripts:
      - name: Set version
        script: |
          echo "VERSION=$(date +%Y.%m.%d-%H%M)" >> $CM_ENV
      - name: Install npm dependencies
        script: npm ci
      - name: Install CocoaPods
        script: |
          cd ios
          bundle install
          bundle exec pod install --repo-update
      - name: Build unsigned .app for a real device
        script: |
          xcodebuild \
            -workspace ios/MCloudApp.xcworkspace \
            -scheme MCloudApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=$VERSION \
            build
      - name: Package as .ipa
        script: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/MCloudApp.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH" >&2
            find build/Build/Products -maxdepth 2 >&2
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -r ../MCloudApp.ipa Payload
      - name: Upload IPA to GitHub Releases
        script: |
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$VERSION\",\"name\":\"MCloud $VERSION\",\"body\":\"Automatisk build\"}" \
            https://api.github.com/repos/Nielsen-97/mcloud-app/releases)
          UPLOAD_URL=$(echo $RELEASE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('upload_url','').split('{')[0])")
          if [ -z "$UPLOAD_URL" ]; then
            echo "Failed to get upload URL"
            exit 0
          fi
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/MCloudApp.ipa \
            "${UPLOAD_URL}?name=MCloudApp.ipa"
          curl -s -X POST https://mcloud.taile49ac8.ts.net/webhook/altstore-update \
            -H "X-Webhook-Token: mcloud-webhook-2026" || true
    artifacts:
      - build/MCloudApp.ipa