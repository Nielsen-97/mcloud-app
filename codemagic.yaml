workflows:
  react-native-ios:
    name: MCloud iOS
    max_build_duration: 60
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS IPA
        script: |
          xcodebuild \
            -workspace ios/MCloudApp.xcworkspace \
            -scheme MCloudApp \
            -configuration Debug \
            -sdk iphoneos \
            -allowProvisioningUpdates \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build
          
          mkdir -p build/ipa/Payload
          cp -r build/Build/Products/Debug-iphoneos/MCloudApp.app build/ipa/Payload/
          cd build/ipa && zip -r ../MCloudApp.ipa Payload
    artifacts:
      - build/MCloudApp.ipa