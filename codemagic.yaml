 workflows:
  react-native-ios:
    name: MCloud iOS
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: development
      vars:
        BUNDLE_ID: "com.mcloud.app"
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Build iOS
        script: |
          xcode-project build-ipa \
            --workspace "ios/MCloudApp.xcworkspace" \
            --scheme "MCloudApp" \
            --config "Debug"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - mathiastrans97@live.dk
