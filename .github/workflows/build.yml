name: Build MCloud iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: echo "VERSION=$(date +%Y.%m.%d-%H%M)" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Install dependencies
        run: npm ci

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build iOS
        run: |
          xcodebuild \
            -workspace ios/MCloudApp.xcworkspace \
            -scheme MCloudApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION=$VERSION \
            build

      - name: Package as IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MCloudApp.app"
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r ../MCloudApp.ipa Payload

      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          RELEASE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$VERSION\",\"name\":\"MCloud $VERSION\",\"body\":\"Automatisk build\"}" \
            https://api.github.com/repos/Nielsen-97/mcloud-app/releases)
          UPLOAD_URL=$(echo $RELEASE | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('upload_url','').split('{')[0])")
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @build/MCloudApp.ipa \
            "${UPLOAD_URL}?name=MCloudApp.ipa"
          curl -s -X POST https://mcloud.taile49ac8.ts.net/webhook/altstore-update \
            -H "X-Webhook-Token: mcloud-webhook-2026" || true
